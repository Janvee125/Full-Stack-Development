<!DOCTYPE html>
<html>

<head>
<title>Order Confirmed</title>

<style>
body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f3f3f3;
}

.box{
background:white;
padding:40px;
border-radius:10px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.check{
font-size:60px;
color:green;
}

button{
margin-top:20px;
padding:10px 20px;
border:none;
background:#2a7de1;
color:white;
border-radius:5px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<div class="check">✔</div>

<h2>Order Placed Successfully!</h2>

<p id="orderId"></p>

<button onclick="goHome()">Back to Home</button>

</div>

<script>

let id = localStorage.getItem("orderId");

if(id){
document.getElementById("orderId").innerHTML =
"<b>Order ID:</b> " + id;
}else{
document.getElementById("orderId").innerHTML =
"<b>No Order Found</b><br>Please place an order";
}

function goHome(){
window.location.href = "http://localhost:3000/index.html";
}

</script>

</body>

</html>
