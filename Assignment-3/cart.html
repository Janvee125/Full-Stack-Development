<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Fashion Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVIGATION BAR -->
<nav class="navbar">
    <div class="nav-container">
        <h1 class="logo">Fashion Store</h1>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="cart.html" class="active cart-link">Cart</a></li>
        </ul>
    </div>
</nav>

<!-- CART SECTION -->
<section class="cart-section">
    <div class="container">
        <h1>Shopping Cart</h1>
        
        <div class="cart-container">
            <div class="cart-items" id="cartItems">
                <!-- Cart items will be loaded here by JavaScript -->
            </div>
            
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax (10%):</span>
                    <span id="tax">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
                <a href="checkout.html" class="btn btn-primary" id="checkoutBtn" style="width: 100%; text-align: center; display: block;">Proceed to Checkout</a>
                <a href="products.html" class="btn btn-secondary" style="width: 100%; text-align: center; display: block;">Continue Shopping</a>
            </div>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer class="footer">
    <p>&copy; 2026 Fashion Store. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
