<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fashion Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVIGATION BAR -->
<nav class="navbar">
    <div class="nav-container">
        <h1 class="logo">Fashion Store</h1>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="cart.html" class="cart-link">Cart</a></li>
        </ul>
    </div>
</nav>

<!-- LOGIN SECTION -->
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-box">
            <h1>Login</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" required>
                </div>
                
                <div class="form-group checkbox">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>
                
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            
            <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
            <p class="forgot-password"><a href="#">Forgot password?</a></p>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer class="footer">
    <p>&copy; 2026 Fashion Store. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
