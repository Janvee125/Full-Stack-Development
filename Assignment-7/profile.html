<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-900 text-white">

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <div class="w-64 bg-gray-800 p-6">
        <h1 class="text-2xl font-bold mb-10">🎓 EduPanel</h1>

        <ul class="space-y-4">
            <li onclick="goDashboard()" class="cursor-pointer hover:text-indigo-400">🏠 Dashboard</li>
            <li class="text-indigo-400">👤 Profile</li>
        </ul>
    </div>

    <!-- Main -->
    <div class="flex-1 p-10">

        <h2 class="text-3xl font-bold mb-8">Student Profile</h2>

        <!-- Profile Info -->
        <div class="bg-gray-800 p-6 rounded-xl shadow flex gap-6 items-center">

            <!-- Photo -->
            <div>
                <img id="preview" src="https://via.placeholder.com/120" 
                class="w-32 h-32 rounded-full object-cover border-4 border-indigo-500">

                <input type="file" onchange="uploadImage(event)" 
                class="mt-3 text-sm">
            </div>

            <!-- Info -->
            <div class="flex-1">
                <input id="name" placeholder="Your Name" 
                class="w-full p-2 mb-3 bg-gray-700 rounded">

                <input id="course" placeholder="Course" 
                class="w-full p-2 mb-3 bg-gray-700 rounded">

                <textarea id="about" placeholder="About You" 
                class="w-full p-2 bg-gray-700 rounded"></textarea>
            </div>

        </div>

        <!-- Subjects -->
        <div class="bg-gray-800 p-6 rounded-xl shadow mt-6">
            <h3 class="text-xl mb-4">📚 Subjects & Marks</h3>
            <ul id="examList" class="space-y-2 text-gray-300"></ul>
        </div>

        <!-- Chart -->
        <div class="bg-gray-800 p-6 rounded-xl shadow mt-6">
            <h3 class="text-xl mb-4">📊 Performance</h3>
            <canvas id="chart"></canvas>
        </div>

        <!-- Save -->
        <button onclick="saveProfile()" 
        class="mt-6 bg-green-600 px-6 py-3 rounded">
            💾 Save Profile
        </button>

    </div>

</div>

<script>
const API = "http://localhost:3000";
let chart;

// Upload image
function uploadImage(event) {
    const file = event.target.files[0];
    const reader = new FileReader();

    reader.onload = function () {
        document.getElementById("preview").src = reader.result;
        localStorage.setItem("profileImage", reader.result);
    };

    reader.readAsDataURL(file);
}

// Load marks from backend
async function loadMarks() {
    const res = await fetch(API + "/marks");
    const data = await res.json();

    const list = document.getElementById("examList");
    list.innerHTML = "";

    const labels = [];
    const marks = [];

    data.forEach(item => {
        list.innerHTML += `<li>${item.subject} - ${item.marks}</li>`;
        labels.push(item.subject);
        marks.push(item.marks);
    });

    drawChart(labels, marks);
}

// Draw chart
function drawChart(labels, data) {
    if (chart) chart.destroy();

    const ctx = document.getElementById("chart");

    chart = new Chart(ctx, {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Marks",
                data: data
            }]
        }
    });
}

// Save profile
function saveProfile() {
    const profile = {
        name: document.getElementById("name").value,
        course: document.getElementById("course").value,
        about: document.getElementById("about").value
    };

    localStorage.setItem("studentProfile", JSON.stringify(profile));
    alert("Profile Saved ✅");
}

// Load profile
function loadProfile() {
    const data = JSON.parse(localStorage.getItem("studentProfile"));

    if (!data) return;

    document.getElementById("name").value = data.name || "";
    document.getElementById("course").value = data.course || "";
    document.getElementById("about").value = data.about || "";

    const img = localStorage.getItem("profileImage");
    if (img) document.getElementById("preview").src = img;
}

// Back
function goDashboard() {
    window.location.href = "index.html";
}

// Init
loadProfile();
loadMarks();
</script>

</body>
</html>
