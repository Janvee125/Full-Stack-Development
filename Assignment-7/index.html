<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-indigo-100 to-blue-100 font-sans">

<div class="flex min-h-screen">

    <!-- Sidebar -->
    <div class="w-64 bg-gradient-to-b from-indigo-900 to-blue-800 text-white p-6 shadow-xl">
        <h1 class="text-3xl font-bold mb-10">🎓 EduPanel</h1>

        <ul class="space-y-4">
            <li class="hover:bg-white hover:text-indigo-900 p-2 rounded cursor-pointer transition">🏠 Dashboard</li>
            <li class="hover:bg-white hover:text-indigo-900 p-2 rounded cursor-pointer transition">👨‍🎓 Students</li>
            
            <!-- ✅ UPDATED SETTINGS -->
            <li onclick="goToProfile()" 
class="hover:bg-white hover:text-indigo-900 p-2 rounded cursor-pointer">
⚙ Settings
</li>
        </ul>
    </div>

    <!-- Main -->
    <div class="flex-1 p-10">

        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-4xl font-bold text-gray-700">Student Dashboard</h2>
            <div class="bg-white px-4 py-2 rounded shadow">👋 Welcome Admin</div>
        </div>

        <!-- Cards -->
        <div class="grid grid-cols-3 gap-6 mb-8">

            <div class="bg-white p-6 rounded-xl shadow hover:scale-105 transition">
                <h3 class="text-gray-500">Total Students</h3>
                <p id="total" class="text-3xl font-bold text-indigo-600">0</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow hover:scale-105 transition">
                <h3 class="text-gray-500">Courses</h3>
                <p class="text-3xl font-bold text-blue-600">5+</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow hover:scale-105 transition">
                <h3 class="text-gray-500">Status</h3>
                <p class="text-3xl font-bold text-green-500">Active</p>
            </div>

        </div>

        <!-- Form -->
        <div class="backdrop-blur-lg bg-white/70 p-6 rounded-xl shadow-lg mb-8">

            <h3 class="text-xl font-semibold mb-4 text-gray-700">Add New Student</h3>

            <div class="flex flex-wrap gap-4">
                <input id="name" placeholder="Name" class="border p-3 rounded w-60">
                <input id="email" placeholder="Email" class="border p-3 rounded w-60">
                <input id="course" placeholder="Course" class="border p-3 rounded w-60">

                <button onclick="addStudent()" 
                class="bg-gradient-to-r from-indigo-600 to-blue-600 text-white px-6 py-3 rounded shadow hover:scale-105 transition">
                    ➕ Add
                </button>
            </div>

        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <table class="w-full text-center">
                <thead class="bg-indigo-600 text-white">
                    <tr>
                        <th class="p-3">Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>

        <!-- ✅ PROFILE SECTION -->
        <div id="profileSection" class="hidden mt-10 bg-white p-6 rounded-xl shadow-lg w-96">

            <h3 class="text-2xl font-bold mb-4">👤 Profile Settings</h3>

            <input id="pname" placeholder="Your Name" class="border p-3 rounded w-full mb-3">
            <input id="pemail" placeholder="Your Email" class="border p-3 rounded w-full mb-3">

            <button onclick="saveProfile()" 
            class="bg-green-600 text-white px-4 py-2 rounded w-full mb-2">
                Save Profile
            </button>

            <button onclick="closeProfile()" 
            class="bg-gray-500 text-white px-4 py-2 rounded w-full">
                Back
            </button>

        </div>

    </div>

</div>

<script>
const API = "http://localhost:3000";

// Load students
async function load() {
    const res = await fetch(API + "/students");
    const data = await res.json();

    document.getElementById("total").innerText = data.length;

    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(s => {
        list.innerHTML += `
        <tr class="border-b hover:bg-gray-100">
            <td class="p-3">${s.name}</td>
            <td>${s.email}</td>
            <td>${s.course}</td>
            <td>
                <button onclick="del('${s._id}')" 
class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">
Delete
</button>
            </td>
        </tr>`;
    });
}

// Add student
async function addStudent() {
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const course = document.getElementById("course").value;

    if (!name || !email || !course) {
        alert("Fill all fields ❌");
        return;
    }

    try {
        const res = await fetch(API + "/add", {   // ✅ FIXED
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, course })
        });

        const data = await res.json();
        console.log(data);

        alert("Added ✅");
        load();

    } catch (err) {
        console.log(err);
        alert("Backend not connected ❌");
    }
}
// Load profile
window.onload = function () {
    load();

    const name = localStorage.getItem("profileName");
    const email = localStorage.getItem("profileEmail");

    if (name) document.getElementById("pname").value = name;
    if (email) document.getElementById("pemail").value = email;
};
function goToProfile() {
    window.location.href = "profile.html";
}
async function del(id) {
    try {
        const res = await fetch("http://localhost:3000/delete/" + id, {
            method: "DELETE"
        });

        const data = await res.json();
        console.log(data);

        alert("Deleted ✅");
        load(); // refresh list

    } catch (err) {
        console.log(err);
        alert("Delete failed ❌");
    }
}
</script>

</body>
</html>
