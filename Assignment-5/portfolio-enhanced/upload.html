<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Resume | Janvee Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{
  background:linear-gradient(135deg,#0f172a,#020617);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.card{
  background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);border-radius:24px;
  padding:40px;width:100%;max-width:440px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.icon{
  width:64px;height:64px;border-radius:16px;
  background:linear-gradient(135deg,#6d28d9,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;margin:0 auto 20px;
}
h2{text-align:center;color:#fff;font-family:'Poppins';font-size:1.4rem;margin-bottom:6px;}
.subtitle{text-align:center;color:#94a3b8;font-size:.85rem;margin-bottom:28px;}

.drop-zone{
  border:2px dashed rgba(139,92,246,0.4);border-radius:14px;
  padding:32px 20px;text-align:center;cursor:pointer;transition:.3s;
  margin-bottom:20px;position:relative;
}
.drop-zone:hover,.drop-zone.dragover{
  border-color:#8b5cf6;background:rgba(139,92,246,0.06);
}
.drop-zone i{font-size:2rem;color:#8b5cf6;margin-bottom:10px;}
.drop-zone p{color:#94a3b8;font-size:.85rem;}
.drop-zone span{color:#c4b5fd;font-weight:600;}
.drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;}

.selected-file{
  background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.3);
  border-radius:10px;padding:12px 16px;margin-bottom:16px;
  display:none;align-items:center;gap:12px;color:#c4b5fd;font-size:.875rem;
}
.selected-file i{color:#8b5cf6;}

.btn{
  width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;
  font-weight:600;font-size:.95rem;transition:.3s;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{opacity:.9;transform:translateY(-1px);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-outline{
  background:transparent;border:1.5px solid rgba(255,255,255,0.1);
  color:#94a3b8;margin-top:10px;
}
.btn-outline:hover{background:rgba(255,255,255,0.05);color:#fff;}

.status{
  margin-top:14px;padding:12px 16px;border-radius:10px;
  font-size:.85rem;display:none;align-items:center;gap:10px;
}
.status.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#4ade80;display:flex;}
.status.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;display:flex;}

.links{display:flex;gap:10px;margin-top:20px;}
.link-btn{
  flex:1;text-align:center;padding:10px;border-radius:10px;
  text-decoration:none;font-size:.8rem;color:#94a3b8;border:1px solid rgba(255,255,255,.08);
  transition:.2s;
}
.link-btn:hover{color:#fff;border-color:rgba(255,255,255,.2);}

/* progress bar */
.progress-bar{
  width:100%;height:4px;background:rgba(255,255,255,.05);
  border-radius:2px;margin-top:12px;overflow:hidden;display:none;
}
.progress-fill{height:100%;background:linear-gradient(135deg,#8b5cf6,#c4b5fd);width:0;transition:.3s;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📄</div>
  <h2>Upload Resume</h2>
  <p class="subtitle">PDF, DOC, or DOCX · Max 10MB · Stored in MongoDB</p>

  <div class="drop-zone" id="dropZone">
    <i class="fas fa-cloud-upload-alt"></i>
    <p>Drag & drop your resume here or <span>browse</span></p>
    <p style="font-size:.75rem;margin-top:6px;">PDF, DOC, DOCX supported</p>
    <input type="file" id="resumeFile" accept=".pdf,.doc,.docx" onchange="fileSelected(this)">
  </div>

  <div class="selected-file" id="selectedFile">
    <i class="fas fa-file-pdf"></i>
    <span id="fileName">No file selected</span>
  </div>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <button class="btn" id="uploadBtn" onclick="upload()" disabled>
    <i class="fas fa-upload"></i> Upload Resume
  </button>
  <button class="btn btn-outline" onclick="window.location='/'">
    <i class="fas fa-arrow-left"></i> Back to Portfolio
  </button>

  <div class="status" id="status"></div>

  <div class="links">
    <a href="/resume" class="link-btn" target="_blank"><i class="fas fa-eye"></i> Preview Resume</a>
    <a href="/admin" class="link-btn" target="_blank"><i class="fas fa-chart-pie"></i> Admin Panel</a>
  </div>
</div>

<script>
const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('resumeFile');
const uploadBtn=document.getElementById('uploadBtn');

// Drag & drop
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{
  e.preventDefault();dropZone.classList.remove('dragover');
  const files=e.dataTransfer.files;
  if(files.length>0){fileInput.files=files;fileSelected(fileInput);}
});

function fileSelected(input){
  const f=input.files[0];
  if(!f) return;
  const allowed=['.pdf','.doc','.docx'];
  const ext=f.name.slice(f.name.lastIndexOf('.')).toLowerCase();
  if(!allowed.includes(ext)){
    showStatus('error','Only PDF, DOC, DOCX files are allowed');return;
  }
  if(f.size>10*1024*1024){
    showStatus('error','File too large (max 10MB)');return;
  }
  document.getElementById('fileName').textContent=f.name+' ('+(f.size/1024).toFixed(1)+' KB)';
  document.getElementById('selectedFile').style.display='flex';
  uploadBtn.disabled=false;
  hideStatus();
}

async function upload(){
  const file=fileInput.files[0];
  if(!file) return;
  uploadBtn.disabled=true;
  uploadBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Uploading...';

  // fake progress
  const bar=document.getElementById('progressBar');
  const fill=document.getElementById('progressFill');
  bar.style.display='block';
  let prog=0;
  const iv=setInterval(()=>{prog=Math.min(prog+Math.random()*15,85);fill.style.width=prog+'%';},200);

  try{
    const fd=new FormData();
    fd.append('resumeFile',file);
    const r=await fetch('/upload-resume',{method:'POST',body:fd});
    const d=await r.json();
    clearInterval(iv);fill.style.width='100%';
    if(d.success){
      showStatus('success','✅ '+d.message);
      setTimeout(()=>{window.location='/';},2000);
    } else {
      showStatus('error','❌ '+(d.message||'Upload failed'));
    }
  }catch(e){
    clearInterval(iv);
    showStatus('error','❌ Server error. Make sure the server is running.');
  } finally {
    uploadBtn.disabled=false;
    uploadBtn.innerHTML='<i class="fas fa-upload"></i> Upload Resume';
  }
}

function showStatus(type,msg){
  const el=document.getElementById('status');
  el.className='status '+type;el.innerHTML=msg;
}
function hideStatus(){
  document.getElementById('status').className='status';
}
</script>
</body>
</html>
