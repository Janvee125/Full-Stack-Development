<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Health Care</title>

<style>

body{
font-family:Arial, Helvetica, sans-serif;
background:#f7f8f9;
margin:0;
}

nav{
background:#002655;
padding:15px;
color:white;
display:flex;
justify-content:space-between;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

.container{
padding:40px;
}

.card{
background:#e7ecf2;
padding:20px;
margin-bottom:30px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.products{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.product{
border:1px solid #ddd;
padding:15px;
border-radius:10px;
text-align:center;
background:white;
}

.product img{
width:120px;
height:120px;
object-fit:contain;
}

button{
background:#2a7de1;
color:white;
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d5fb0;
}

input,select{
width:100%;
padding:10px;
margin-top:10px;
border:1px solid #ccc;
border-radius:5px;
}

</style>
</head>

<body>

<nav>

<h2>Smart Health</h2>

<div>
<a href="#medicine">Medicines</a>
<a href="#appointment">Appointment</a>
<a href="#prescription">Prescription</a>
<a href="#tracking">Tracking</a>
<a href="cart.html">Cart 🛒</a>
</div>

</nav>

<div class="container">

<!-- MEDICINES -->
<div class="card" id="medicine">

<h3>Buy Medicines</h3>

<div class="products">

<div class="product">
<img src="para.png">
<h4>Paracetamol 650mg</h4>
<p>₹40</p>
<button onclick="addCart('Paracetamol 650mg',40)">Add to Cart</button>
</div>

<div class="product">
<img src="vitamin c.png">
<h4>Vitamin C</h4>
<p>₹120</p>
<button onclick="addCart('Vitamin C',120)">Add to Cart</button>
</div>

<div class="product">
<img src="dolo 650.png">
<h4>Dolo 650</h4>
<p>₹280</p>
<button onclick="addCart('Dolo 650',280)">Add to Cart</button>
</div>

</div>
</div>

<!-- APPOINTMENT -->
<div class="card" id="appointment">

<h3>Book Appointment</h3>

<input type="text" id="patientName" placeholder="Patient Name">

<select id="doctor">
<option value="">Select Doctor</option>
<option>Dr. Sharma</option>
<option>Dr. Patel</option>
<option>Dr. Rao</option>
</select>

<input type="date" id="date">

<button onclick="bookAppointment()">Book Appointment</button>

<p id="appointMsg"></p>

</div>

<!-- PRESCRIPTION -->
<div class="card" id="prescription">

<h3>Upload Prescription</h3>

<input type="file" id="file">

<button onclick="uploadPrescription()">Upload</button>

<p id="prescriptionMsg"></p>

</div>

<!-- TRACKING -->
<div class="card" id="tracking">

<h3>Medicine Tracking</h3>

<input type="text" id="orderId" placeholder="Enter Order ID">

<button onclick="trackOrder()">Track</button>

<p id="trackMsg"></p>

</div>

</div>

<script>

// CART
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addCart(name,price){

let item = cart.find(p=>p.name===name);

if(item){
item.qty +=1;
}else{
cart.push({name:name,price:price,qty:1});
}

localStorage.setItem("cart",JSON.stringify(cart));

alert(name+" added to cart");

}

// APPOINTMENT
function bookAppointment(){

let name = document.getElementById("patientName").value;
let doctor = document.getElementById("doctor").value;
let date = document.getElementById("date").value;

if(!name || !doctor || !date){
document.getElementById("appointMsg").innerHTML =
"<span style='color:red'>Please fill all fields</span>";
return;
}

document.getElementById("appointMsg").innerHTML =
"<span style='color:green'>Appointment booked successfully!</span>";

}

// PRESCRIPTION
function uploadPrescription(){

let file = document.getElementById("file").value;

if(!file){
document.getElementById("prescriptionMsg").innerHTML =
"<span style='color:red'>Please select a file</span>";
return;
}

document.getElementById("prescriptionMsg").innerHTML =
"<span style='color:green'>Prescription uploaded successfully!</span>";

}

// TRACK ORDER
function trackOrder(){

let id = document.getElementById("orderId").value;

if(!id){
alert("Please enter Order ID");
return;
}

fetch("/track/" + id)
.then(res => res.json())
.then(data => {
document.getElementById("trackMsg").innerHTML =
"<span style='color:green'>Order Status: " + data.status + "</span>";
})
.catch(() => {
document.getElementById("trackMsg").innerHTML =
"<span style='color:red'>Order not found ❌</span>";
});

}

</script>

</body>
</html>
